name: Sync RuleMesh sources
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: rulemesh-source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sync -- --write
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: changes
        run: |
          if git diff --quiet -- Source sources; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(node -p "require('./sources/registry.json').upstream.revision.slice(0,12)")
          overrides=$(git hash-object sources/overrides.json)
          branch="automation/ruleset-${revision}-${overrides:0:8}"
          git config user.name codingmesh
          git config user.email codingmesh@users.noreply.github.com
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "$branch"
            git diff --exit-code FETCH_HEAD -- Source sources
            candidate_sha=$(git rev-parse FETCH_HEAD)
          else
            git switch -c "$branch"
            git add Source sources
            git commit -m "chore: sync ruleset sources to ${revision}"
            git push origin "$branch"
            candidate_sha=$(git rev-parse HEAD)
          fi
          existing_pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create --base main --head "$branch" --title "chore: sync ruleset sources to ${revision}" --body "Updates pinned MetaCubeX rule sources. Review the generated ruleset diff in CI before merging."
          fi
          gh workflow run main.yml --ref "$branch" --field "source_ref=$candidate_sha"
